name: Materialize Shree Gauri preview source
on:
  push:
    branches:
      - feature/shreegauri-final-preview
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/shreegauri-final-preview
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source changes
        run: node scripts/apply-preview-patch.mjs
      - name: Commit materialized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize Shree Gauri preview source"
          git push
