<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"><title>Shree Gauri Admin</title></head><body><div class="adminShell"><aside><img src="assets/shree-gauri-logo.png" alt="Shree Gauri"><p>PRIVATE ADMIN</p><nav><button data-view="products" class="active">Products</button><button data-view="variants">Carat / Ratti</button><button data-view="orders">Orders</button><a href="index.html" target="_blank">View Store ↗</a></nav><button id="signOut" class="signOut">Sign out</button></aside><main><section id="login" class="loginCard"><h1>Admin Login</h1><p>Sign in with the Shree Gauri administrator account.</p><form id="loginForm"><label>Email<input id="loginEmail" type="email" value="gauritechnologiespvt@gmail.com" required></label><label>Password<input id="loginPassword" type="password" required></label><button>Sign In</button><div id="loginMsg" class="msg"></div></form></section><div id="dashboard" hidden><header><div><small>SHREE GAURI</small><h1>Store Manager</h1></div><button id="newProduct">+ Add Product</button></header><div id="status" class="msg"></div><section class="stats"><div><b id="statProducts">0</b><span>Products</span></div><div><b id="statActive">0</b><span>Active</span></div><div><b id="statStock">0</b><span>Total Stock</span></div><div><b id="statOne">0</b><span>One of One</span></div></section><section id="orderPanel" hidden><div class="panelHead"><h2>Orders</h2><button id="refreshOrders">Refresh</button></div><div id="orderTable" class="table"></div></section><section id="productPanel"><div class="panelHead"><h2>Products</h2><input id="adminSearch" placeholder="Search products…"></div><div id="productTable" class="table"></div></section><section id="editor" class="drawer" hidden><div class="drawerHead"><h2 id="editorTitle">Add Product</h2><button id="closeEditor">×</button></div><form id="productForm"><input id="productId" type="hidden"><div class="grid"><label>Product name<input id="name" required></label><label>Category<select id="category" required></select></label><label>Price (₹)<input id="price" type="number" min="0" step="0.01" required></label><label>Compare-at price (₹)<input id="oldPrice" type="number" min="0" step="0.01"></label><label>SKU<input id="sku"></label><label>Stock quantity<input id="stock" type="number" min="0" value="1" required></label><label>Badge<input id="badge" placeholder="New / Limited / Featured"></label><label>Material / Type<input id="material"></label><label>Weight (grams)<input id="weight" type="number" min="0" step="0.001"></label><label>Gemstone name<input id="gemstone"></label><label>Natural / Lab status<input id="naturalLab"></label><label>Certification<input id="certification"></label><label>Origin<input id="origin"></label><label>Treatment<input id="treatment"></label><label>Shape<input id="shape"></label><label>Colour<input id="color"></label></div><label>Short description<textarea id="shortDesc" rows="2"></textarea></label><label>Full description<textarea id="desc" rows="5"></textarea></label><div class="checks"><label><input id="active" type="checkbox" checked> Active on website</label><label><input id="featured" type="checkbox"> Featured</label><label><input id="oneOfOne" type="checkbox"> One of One</label></div><div class="imageBox"><label>Primary product photo<input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp"></label><input id="imageUrl" placeholder="Image URL (filled automatically after upload)"><img id="imagePreview" alt=""></div><div class="formActions"><button type="button" id="deleteProduct" class="danger" hidden>Delete Product</button><button type="submit">Save Product</button></div></form><div id="variantEditor" class="variantEditor" hidden><h3>Carat / Ratti Options</h3><p>Add variants after saving the product.</p><form id="variantForm" class="variantForm"><input id="variantId" type="hidden"><input id="vLabel" placeholder="Label e.g. 2.25 Carat" required><input id="vCarat" type="number" step="0.001" min="0" placeholder="Carat"><input id="vRatti" type="number" step="0.001" min="0" placeholder="Ratti"><input id="vPrice" type="number" step="0.01" min="0" placeholder="Price ₹"><input id="vStock" type="number" min="0" value="1" placeholder="Stock"><button>Add Option</button></form><div id="variantList"></div></div></section></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin.js"></script></body></html>
